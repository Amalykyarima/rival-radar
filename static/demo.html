<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rival Radar · live demo</title>
<style>
  body { margin:0; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:#ecebe7; color:#17171c; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 16px; background:#fff; border-bottom:1px solid #e4e4ea; flex-wrap:wrap; }
  .bar a { color:#6950F3; }
  .tabs button { border:1px solid #e4e4ea; background:#fff; border-radius:999px; padding:6px 14px; font:inherit; cursor:pointer; }
  .tabs button.on { background:#0D0D0D; color:#fff; border-color:#0D0D0D; }
  .split { display:grid; grid-template-columns:430px 1fr; gap:12px; padding:12px; height:calc(100vh - 58px); box-sizing:border-box; }
  .pane { display:flex; flex-direction:column; min-height:0; }
  .pane b { font-size:12px; color:#6b6b76; font-weight:600; margin:0 0 6px 4px; }
  iframe { flex:1; width:100%; border:1px solid #e4e4ea; border-radius:12px; background:#fff; }
  @media (max-width:900px) { .split { grid-template-columns:1fr; height:auto; } iframe { height:85vh; } }
</style>
</head>
<body>
<div class="bar"><strong>Rival Radar · live demo</strong>
  <span class="tabs">Owner side: <button id="tPrice" class="on">1 · Price check (agent)</button> <button id="tCamp">2 · Campaigns &amp; approvals</button></span>
  <span><a href="/shop.html" target="_blank">site only</a> · <a href="/" target="_blank">price check only</a> · <a href="/campaigns.html" target="_blank">campaigns only</a></span></div>
<div class="split">
  <div class="pane"><b>CUSTOMER · booking site</b><iframe src="shop.html?v=13" title="Customer storefront"></iframe></div>
  <div class="pane"><b id="ownerLabel">OWNER · Rival Radar price check</b><iframe id="owner" src="/" title="Owner app"></iframe></div>
</div>
<script>
  const owner = document.getElementById("owner"), lab = document.getElementById("ownerLabel");
  const pick = (src, text, on) => { owner.src = src; lab.textContent = text; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === on)); };
  document.getElementById("tPrice").onclick = e => pick("/", "OWNER · Rival Radar price check", e.target);
  document.getElementById("tCamp").onclick = e => pick("campaigns.html?v=13", "OWNER · Campaigns & approvals", e.target);
</script>
</body>
</html>
